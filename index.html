!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ingreso Secreto</title>
  <style>
    body {
      background: #f0f0f0;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-box {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      text-align: center;
    }
    input[type="password"] {
      padding: 10px;
      margin-top: 10px;
      width: 80%;
      font-size: 16px;
    }
    button {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

<div class="login-box">
  <h2>Ingrese la clave secreta</h2>
  <input type="password" id="clave" placeholder="Clave">
  <br>
  <button onclick="verificarClave()">Entrar</button>
  <div id="mensajeCorrecto" class="hidden">
    <h2>¡Acceso concedido!</h2>
  </div>
  <div id="mensajeIncorrecto" class="hidden">
    <h2 style="color: red;">Clave incorrecta</h2>
  </div>
</div>

<script>
function verificarClave() {
  const claveIngresada = document.getElementById('clave').value;
  const claveCorrecta = '1234'; // Cambia esto a la clave que quieras

  if (claveIngresada === claveCorrecta) {
    document.getElementById('mensajeCorrecto').classList.remove('hidden');
    document.getElementById('mensajeIncorrecto').classList.add('hidden');
  } else {
    document.getElementById('mensajeIncorrecto').classList.remove('hidden');
    document.getElementById('mensajeCorrecto').classList.add('hidden');
  }
}
</script>

</body>
</html>
